<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LidaReality - New Project</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;200;300;400;500;600;700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rokkitt:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{url_for('static',filename='css/createProject.css')}}">
    <script>
        var imageUrl = '{{url}}'
        var scanUrl = '{{scan}}'
    </script>
</head>
<body>
    
    <nav class="navbar">
        <div class="navbarContainer">
            <div class="title">
                <img src="../../static/icons/L (4).png" class="logo"/>
                <img src="../../static/icons/asal.png" class="asal"/>
                <img src="../../static/icons/flag2.png" class="flag"/>
            </div>
            
            <div class="account">
                <div class="profileInfo"><img src="../../static/icons/caret-down-solid.svg" alt="#">My Profile</div>
                <ul class="profileList">
                    <li class="profileInformation"><a href="#">Profile informaiton</a></li>
                    <li class="logout"><a href="/logout">Log Out</a></li>
                </ul>
                <div class="profile">
                <img src="../../static/icons/id-badge-solid.svg" alt="#">
                <div class="name">{{name}}<span>User</span></div>
                </div>
                
            </div>
        </div>
    </nav>

    <main class="main">
        <div class="container">
            <h1 class="title">Create new project</h1>
            <form action="#" class="newProjectForm" id="projectForm" method="post" enctype="multipart/form-data">
                <div class="field">
                    <label for="id">Project ID</label>
                    <input type="text" name="id">
                </div>
                
                <div class="field">
                    <label for="name">Project Name</label>
                    <input type="text" name="name">
                </div>
                
                <div class="field">
                    <label for="description">Project Description</label>
                    <input type="text" name="description">
                </div>
                
                <div class="field">
                    <label for="address">Project Address</label>
                    <input type="text" name="address">
                </div>
                
                <div class="field">
                    <label for="coordinates">Coordinates x,y (m)</label>
                    <input type="text" name="coordinates">
                </div>
                <div class="field">
                    <label for="date">Date</label>
                    <input type="date" name="date">
                </div>
                
                <div class="field">
                    <label for="type">Project Type</label>
                    <input type="text" name="type">
                </div>
                
                <div class="field">
                    <label for="folder">Project Folder Name</label>
                    <input type="text" name="folder" >
                </div>

                <div class="field">
                    <label for="jsonFile">Project file (JSON)</label>
                    <input class="jsonFile" type="file" name="jsonFile">
                </div>
                
            </form>

            <!-- <h1>Add scans</h1>
            <form action="#" class="newProjectForm" id="scansForm" method="post" enctype="multipart/form-data">
                <div class="scan">
                    <div class="field">
                        <label for="scanFile">Scan file (.xyz)</label>
                        <input class="scanFile" type="file" name="scanFile0">
                    </div>
                    <div class="field">
                        <label for="scanImage">Scan image (.jpg)</label>
                        <input class="scanImage" type="file" name="scanImage0">
                    </div>
                    <div class="field">
                        <label for="scanPosition">Scan position (x,y,z) (m)</label>
                        <input class="scanPosition x" type="text" name="x" placeholder="X"><input class="scanPosition y" type="text" name="y" placeholder="Y"><input class="scanPosition z" type="text" name="z" placeholder="Z">
                    </div>
                </div>
            </form> -->
            <!-- <button class="addScan" type="button"> + Add scan </button> -->
            <button class="submitBtn" type="button">Create new project</button>
        </div>
        <div class="loadingPopup">
            <div class="loading">
                <div class="cicle"></div>
                <p>Loading...</p>
            </div>
            <div class="completed">
                <img src="../../static//icons/circle-check-solid.svg" alt="#" class="check">
                <button class="continue">Continue</button>
            </div>
            
        </div>
    </main>






    <script src="https://kit.fontawesome.com/08f65554c5.js" crossorigin="anonymous"></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/three.js/105/three.min.js"
        integrity="sha512-uWKImujbh9CwNa8Eey5s8vlHDB4o1HhrVszkympkm5ciYTnUEQv3t4QHU02CUqPtdKTg62FsHo12x63q6u0wmg=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    ></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.4.0/gsap.min.js"></script>
    <script src="{{url_for('static', filename = 'dist/panolens.js')}}"></script> 
    <script src="{{url_for('static', filename = 'dist/jquery.min.js')}}"></script> 
    <script src="{{url_for('static', filename = 'dist/ol.js')}}"></script> 
    <script src="{{url_for('static', filename = 'dist/ol-ext.min.js')}}"></script>
    <script src="{{url_for('static', filename = 'js/createProject.js')}}" type="module"></script> 
</body>
</html>
